name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  docker:
    # Stage 3 build proof: tests+lint pass first, then the container builds and
    # runs one offline solve. No registry push.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push)
        run: docker build -t convex-optimization:ci .
      - name: Offline smoke solve in the container
        run: docker run --rm --network none convex-optimization:ci
