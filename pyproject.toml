[project]
name = "convex_optimization"
version = "0.2.0"
description = "Convex optimization algorithms with reproducible benchmarking against SciPy solvers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
