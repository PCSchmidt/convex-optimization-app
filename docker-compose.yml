# Local-only compose (Stage 3 smoke + Stage 4 API). NOT a production
# deployment: no TLS, no auth, no multi-user serving, no public exposure.
#
#   docker compose build              # build the image
#   docker compose up api             # serve the FastAPI app on ${PORT:-8000}
#   docker compose run --rm smoke     # one offline CLI solve (network_mode none)
#   docker compose down               # stop and remove the containers
#
# Environment variables (the only configuration surface; no secrets exist):
#   PORT  host port for the api service (default 8000). The container always
#         listens on 8000 internally; PORT changes only the published host port.
services:
  api:
    build:
      context: .
      args:
        PYTHON_TAG: "3.12"
    image: convex-optimization:local
    ports:
      - "${PORT:-8000}:8000"
    # Normal networking is REQUIRED here: a published port is incompatible
    # with network_mode "none". The solve itself still needs no network
    # (seeded synthetic problems; CPU-only ground truth at request time).
    # --no-access-log: the Stage 5 structured JSON log lines (stdout) are the
    # sole log stream; uvicorn's non-JSON access log is suppressed.
    command: ["uvicorn", "convex_optimization.app:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]

  smoke:
    build:
      context: .
      args:
        PYTHON_TAG: "3.12"
    image: convex-optimization:local
    # network_mode "none" proves the CLI solve is fully offline.
    network_mode: "none"
    command: ["python", "-m", "convex_optimization.cli", "--problem", "logistic", "--method", "nesterov"]
